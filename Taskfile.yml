version: "3"

# Optional; real environment variables still take precedence.
dotenv: ['.env']

tasks:
  run:
    cmds: [go run .]
  test:
    cmds: [go test -p 1 ./...]
  fmt:
    cmds: [go fmt ./...]
  migrate-dev-plan:
    desc: Print the migration Atlas would apply to PSQL_URL, without applying it.
    cmds:
      - atlas schema apply --url "$PSQL_URL" --dev-url "$PSQL_DEV_URL" --to file://schema.hcl --dry-run
  migrate-dev:
    desc: Apply schema.hcl to PSQL_URL. PSQL_DEV_URL is a scratch db Atlas wipes each run.
    cmds:
      - atlas schema apply --url "$PSQL_URL" --dev-url "$PSQL_DEV_URL" --to file://schema.hcl
  generate-sql-schema:
    cmds:
      - atlas schema inspect --url "$PSQL_URL" --format '{{"{{ sql . }}"}}' > schema.sql
  sqlcgen:
    cmds: [sqlc generate]
  docker-build:
    desc: Build the deployable image.
    cmds: [docker compose build]
  e2e-media:
    desc: Generate multi-track test MKVs into testdata/e2e (needs local ffmpeg).
    cmds: [sh scripts/make-test-media.sh]
  e2e-run:
    desc: Run against the generated test media with the software encoder.
    cmds:
      - ENCODER=software MEDIA_PATH=$PWD/testdata/e2e STREAMS_PATH=/tmp/hotpot-streams go run .
